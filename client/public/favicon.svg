<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e68c"/>
      <stop offset="40%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#c9a84c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#f0e68c;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGrad)"/>

  <!-- Subtle shimmer overlay -->
  <rect width="1024" height="1024" rx="180" fill="url(#shimmer)"/>

  <!-- Gold border ring -->
  <rect width="1024" height="1024" rx="180" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.7"/>

  <!-- Inner subtle ring -->
  <rect x="20" y="20" width="984" height="984" rx="165" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.25"/>

  <!-- Trophy group - centered -->
  <g transform="translate(212, 120)" filter="url(#glow)">
    <!-- Crown on top of trophy -->
    <path d="M190 50 L215 0 L250 40 L285 0 L310 50 Z" fill="url(#goldGrad)"/>
    <!-- Crown jewels -->
    <circle cx="215" cy="12" r="10" fill="#c9a84c"/>
    <circle cx="250" cy="8" r="12" fill="#d4af37"/>
    <circle cx="285" cy="12" r="10" fill="#c9a84c"/>

    <!-- Trophy cup body -->
    <path d="M150 60 Q150 40 200 40 L300 40 Q350 40 350 60 L330 260 Q320 300 250 310 Q180 300 170 260 Z" fill="url(#goldGrad)"/>

    <!-- Trophy cup highlight -->
    <path d="M170 70 Q170 55 210 55 L290 55 Q285 120 250 140 Q215 120 210 70 Z" fill="url(#shimmer)" opacity="0.5"/>

    <!-- Left handle -->
    <path d="M160 100 Q80 100 80 180 Q80 260 160 240" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M340 100 Q420 100 420 180 Q420 260 340 240" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Trophy star/seal -->
    <path d="M250 140 L265 185 L312 185 L275 210 L290 255 L250 230 L210 255 L225 210 L188 185 L235 185 Z" fill="#0a0a0a" opacity="0.8"/>
    <path d="M250 148 L262 180 L296 180 L269 199 L281 231 L250 212 L219 231 L231 199 L204 180 L238 180 Z" fill="url(#goldGrad)" opacity="0.9"/>

    <!-- Trophy stem -->
    <rect x="220" y="310" width="60" height="100" rx="4" fill="url(#goldGrad)"/>

    <!-- Trophy base -->
    <rect x="150" y="410" width="200" height="40" rx="12" fill="url(#goldGrad)"/>
    <!-- Base highlight -->
    <rect x="155" y="413" width="190" height="15" rx="8" fill="url(#shimmer)" opacity="0.4"/>
  </g>

  <!-- Lock symbol (bottom right of trophy base) -->
  <g transform="translate(630, 580)" filter="url(#softGlow)">
    <rect x="0" y="50" width="90" height="75" rx="12" fill="url(#goldGrad)"/>
    <path d="M18 50 L18 30 Q45 0 72 30 L72 50" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="45" cy="87" r="14" fill="#0a0a0a"/>
    <rect x="41" y="87" width="8" height="18" rx="4" fill="#0a0a0a"/>
  </g>

  <!-- Brand text -->
  <text x="512" y="780" font-family="'Playfair Display', Georgia, serif" font-size="88" font-weight="700" fill="url(#goldGrad)" letter-spacing="6" text-anchor="middle" filter="url(#softGlow)">LUXE</text>

  <text x="512" y="860" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="400" fill="#d4af37" letter-spacing="18" text-anchor="middle">PRIZE DRAWS</text>

  <!-- Decorative lines flanking text -->
  <line x1="100" y1="882" x2="380" y2="882" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="644" y1="882" x2="924" y2="882" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="512" y="940" font-family="'Inter', Arial, sans-serif" font-size="28" fill="#c9a84c" letter-spacing="8" text-anchor="middle" opacity="0.75">LUXURY · TRANSPARENT · GUARANTEED</text>
</svg>
