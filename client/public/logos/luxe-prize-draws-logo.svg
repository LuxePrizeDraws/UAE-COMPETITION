<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e68c;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" rx="12" fill="url(#bgGrad)"/>
  <!-- Gold border -->
  <rect width="400" height="200" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Trophy icon group (left) -->
  <g transform="translate(40, 30)" filter="url(#glow)">
    <!-- Trophy cup -->
    <path d="M45 10 Q45 0 55 0 Q65 0 65 10 L63 40 Q63 52 55 56 Q47 52 47 40 Z" fill="url(#goldGrad)"/>
    <!-- Trophy handles -->
    <path d="M47 18 Q35 18 35 30 Q35 42 47 38" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M63 18 Q75 18 75 30 Q75 42 63 38" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Trophy stem -->
    <rect x="51" y="56" width="8" height="18" fill="url(#goldGrad)"/>
    <!-- Trophy base -->
    <rect x="40" y="74" width="30" height="6" rx="3" fill="url(#goldGrad)"/>
    <!-- Crown at top -->
    <path d="M47 6 L49 0 L55 5 L61 0 L63 6 Z" fill="url(#goldGrad)"/>
    <!-- Star on trophy -->
    <path d="M55 22 L56.5 27 L62 27 L57.5 30 L59 35 L55 32 L51 35 L52.5 30 L48 27 L53.5 27 Z" fill="#0a0a0a"/>
    <!-- Lock symbol at bottom right of trophy -->
    <g transform="translate(68, 60)">
      <rect x="0" y="8" width="14" height="11" rx="2" fill="url(#goldGrad)"/>
      <path d="M3 8 L3 5 Q7 0 11 5 L11 8" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="7" cy="13" r="1.8" fill="#0a0a0a"/>
    </g>
  </g>

  <!-- Brand name text -->
  <text x="160" y="82" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="url(#goldGrad)" letter-spacing="1">LUXE</text>
  <text x="158" y="115" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="400" fill="#d4af37" letter-spacing="4">PRIZE DRAWS</text>

  <!-- Decorative line -->
  <line x1="155" y1="125" x2="355" y2="125" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Tagline -->
  <text x="255" y="148" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#c9a84c" letter-spacing="2.5" text-anchor="middle" opacity="0.8">LUXURY · TRANSPARENT · GUARANTEED</text>
</svg>
